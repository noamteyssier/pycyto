<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cyto QC · __TITLE__</title>
  <style>/*__CSS__*/</style>
</head>
<body>
<header>
  <h1>cyto QC report</h1>
  <span class="sub" id="title"></span>
  <span class="sub" id="generated"></span>
</header>
<nav>
  <button data-tab="summary" class="active">Summary</button>
</nav>

<main>
  <section class="tab active" id="tab-summary">
    <div class="grid g4" id="hero"></div>
    <div class="grid g2 gap">
      <div class="grid">
        <div class="card"><h2>Sequencing</h2><table class="kv" id="kv-sequencing"></table></div>
        <div class="card"><h2>Cells</h2><table class="kv" id="kv-cells"></table></div>
      </div>
      <div class="card">
        <h2>Barcode rank plot</h2>
        <div class="controls">Probe barcode <select id="rank-select"></select></div>
        <div id="rank-plot"></div>
        <div class="legend"><span><i class="swatch cell"></i>Cells</span><span><i class="swatch bg"></i>Background</span></div>
      </div>
    </div>
    <div class="grid g2 gap" id="summary-panels">
      <div class="card"><h2>UMIs per cell <span class="hint"></span></h2><div id="umi-hist"></div></div>
      <div class="card"><h2>Genes per cell <span class="hint"></span></h2><div id="gene-hist"></div></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<script id="data" type="application/json">__DATA__</script>
<!-- charts need an internet connection: d3 + Observable Plot from jsDelivr, pinned and integrity-checked -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
        integrity="sha256-8glLv2FBs1lyLE/kVOtsSw8OQswQzHr5IfwVj864ZTk=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"
        integrity="sha256-Q1gIZGd0B3fdeI1rJ6lc69uu/dUMcwowYBFwc71xNMs=" crossorigin="anonymous"></script>
<script>/*__JS__*/</script>
<script>main();</script>
</body>
</html>
